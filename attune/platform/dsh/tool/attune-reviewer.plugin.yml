# The one declared DSH overlay that turns the composed `headless` profile into
# the DATA-SCOPED REVIEWER profile of the gated pilot.
#
# The earlier live dispatch proved the binding false in practice: the composed
# profile exposed the whole broad native tool catalog to the reviewing model
# (the ACTUAL provider request header carried `bash`, `read`/`write`/`edit`,
# `glob`/`grep`, `subagent`/`subagent_fork`, `send_message`/`interrupt_agent`/
# `list_agents`, `workflow`, `web_search`/`web_fetch`, `skill`, `todo_write`,
# `job_*`, the goal tools and `exit_plan_mode` beside the authored operations).
# The reviewer could therefore bypass the packet / evaluator / hidden-detector
# files by reading them directly.
#
# This overlay uses the SAME declared loader mechanism as the other overlays of
# this adapter: a `--patch` list that addresses EXISTING profile rows by id and
# disables them. It is applied after every bundle layer, so the last write wins
# and the broad surfaces are not selected. No custom sandbox, shell wrapper or
# second harness is introduced, and nothing here is restated in TypeScript: the
# rows below are the declared ids of the shipped composition.
#
# What remains model-facing after this overlay is exactly the authored adapter
# surface: the shared bounded plain-read facade (`attune_source_read`), the
# shared candidate-commit operation (`attune_commit_candidate`) in BOTH arms,
# and the R1-only progressive packet operation (`attune_packet_operation`), which
# a separate overlay mounts only in the packet arm.
#
# This reviewer profile is mounted in BOTH prospective arms and in the
# provider-free catalog proof, so the composed reviewer catalog is identical in
# the offline check and in the live observation.

# Shell execution.
- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: true

# Broad native filesystem reading, writing and searching.
- id: tool-fs
  disabled: true
- id: tool-fs-search
  disabled: true

# Subagent / collaboration surfaces.
- id: tool-subagent
  disabled: true
- id: tool-subagent-fork
  disabled: true
- id: tool-subagent-control
  disabled: true
- id: tool-subagent-list-agents
  disabled: true
- id: subagent
  disabled: true
- id: subagent-spawn-in-process
  disabled: true
- id: subagent-fork-in-process
  disabled: true

# Workflow / run_file style execution surface and the PTC workflow driver.
- id: tool-workflow
  disabled: true
- id: workflow-ptc
  disabled: true

# Web acquisition.
- id: tool-web
  disabled: true
- id: web
  disabled: true
- id: web-search-deepseek
  disabled: true
- id: web-fetch-http
  disabled: true

# Skills, todos, goals, background jobs and plan mode register further
# model-facing tools that are not part of the declared reviewer surface.
- id: tool-skill
  disabled: true
- id: tool-todo
  disabled: true
- id: tool-goal
  disabled: true
- id: tool-ralph
  disabled: true
- id: tool-jobs
  disabled: true
- id: plan-mode
  disabled: true
