[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "attune-activegraph"
version = "0.0.0"
description = "Typed ActiveGraph bridge for the Attune Effect MCP service."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
  "activegraph==1.10.0",
  "mcp==1.28.1",
  "pydantic==2.13.4",
  "rfc8785==0.1.4",
]

[project.scripts]
attune-activegraph-smoke = "attune_activegraph.smoke:main"

[project.entry-points."activegraph.packs"]
attune_effect_tools = "attune_activegraph.pack:pack"

[dependency-groups]
dev = [
  "basedpyright==1.39.9",
  "datamodel-code-generator==0.71.0",
  "pytest==9.1.1",
  "ruff==0.16.0",
]

[tool.uv]
package = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.basedpyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src", "tests"]
ignore = ["src/attune_activegraph/generated"]

[tool.pytest.ini_options]
addopts = ["-q"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["src/attune_activegraph/generated"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]
