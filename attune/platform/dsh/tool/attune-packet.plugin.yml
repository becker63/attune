# The one declared DSH overlay that mounts the authored packet tool.
#
# It is a loader patch list (`--patch`) whose single patch INSERTS the tool as a
# new profile row. The row's `name` is a RELATIVE module specifier, which the
# declared DSH loader anchors beside this file (`anchorInsertedPluginNames`), so
# the tool resolves from this package's own directory instead of from the
# profile's installed-package scope.
#
# The packet tool is the substitutive delivery operation of the shared evidence
# interface: it serves the compiled `evidence_reviewbench_packets` stage tree over
# the COMPLETE admitted base/head source world progressively, discloses the
# retained full-source escape and reads one exact declared file of the complete
# changed world whole. It is mounted by its own overlay so a run composes exactly
# the operations it declares.
- insert:
    - id: attune-packet-tool
      name: ./packet_tool.mjs
