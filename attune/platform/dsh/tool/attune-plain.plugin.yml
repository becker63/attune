# The one declared DSH overlay that mounts the shared bounded plain-read facade.
#
# It is a loader patch list (`--patch`) whose single patch INSERTS the facade as
# a new profile row. The row's `name` is a RELATIVE module specifier, which the
# declared DSH loader anchors beside this file (`anchorInsertedPluginNames`), so
# the facade resolves from this package's own directory instead of from the
# profile's installed-package scope.
#
# This overlay is mounted in BOTH prospective arms (R0 and R1). It is the SHARED
# ordinary source interface of the pilot: a bounded `list` / `read` / `whole-file`
# surface over the sealed `packet_boundary` bytes, digest-verified and lossless,
# with explicit omitted bytes and a continuation. Native filesystem and shell
# source access are NOT selected. In R1 the R1-only progressive packet overlay is
# mounted on top of the SAME facade, and that packet operation is the only arm
# difference in source access.
- insert:
    - id: attune-plain-tool
      name: ./plain_tool.mjs
