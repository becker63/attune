# The one declared DSH overlay that mounts the SHARED candidate-commit
# operation of the gated pilot.
#
# The pilot's two arms must present the SAME candidate-commit interface, and the
# reviewer profile must NOT present the fixture-world evidence operation: the
# earlier overlay `attune-tool.plugin.yml` mounted the authored evidence tool
# (`attune_evidence_operation`, whose default world is the capawesome fixture
# world) TOGETHER WITH the commit tool, and the earlier live dispatch actually
# called that fixture-world operation. The pilot therefore mounts the commit
# operation alone through this overlay, and both arms mount it identically.
#
# The row's `name` is a RELATIVE module specifier, which the declared DSH loader
# anchors beside this file, so the tool resolves from this package's own
# directory. Nothing about the commit semantics is restated here; the tool reads
# the run's declared per-task world binding (`ATTUNE_EVIDENCE_WORLD`,
# `ATTUNE_EVIDENCE_SOURCE_ROOT`, `ATTUNE_EVIDENCE_PROJECTION`) exactly as before.
- insert:
    - id: attune-commit-tool
      name: ./commit_tool.mjs
