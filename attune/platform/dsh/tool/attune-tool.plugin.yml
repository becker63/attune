# The one declared DSH overlay that mounts the authored evidence tool.
#
# It is a loader patch list (`--patch`) whose single patch INSERTS the tool as a
# new profile row. The row's `name` is a RELATIVE module specifier, which the
# declared DSH loader anchors beside this file (`anchorInsertedPluginNames`), so
# the tool resolves from this package's own directory instead of from the
# profile's installed-package scope. That is the loader's own supported
# mechanism: a bare package name is routed through the profile resolution table,
# which does not carry an authored plugin that was never npm-installed.
#
# The tool reads the declared fixture world that ships beside it (the manifest,
# the sealed source root and the generated contract package). A run may override
# any of them through the tool's declared config or environment.
#
# The same overlay also mounts the shared candidate-commit tool, so the acquire
# and commit operations are the two model-facing operations of one authored
# package and both arms present exactly them.
- insert:
    - id: attune-evidence-tool
      name: ./evidence_tool.mjs
    - id: attune-commit-tool
      name: ./commit_tool.mjs
