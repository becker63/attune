name: Deploy documentation

on:
  push:
    branches:
      - main
      - main-v2
  workflow_dispatch:

permissions: {}

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/main-v2'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.15.0

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.11.17
          enable-cache: true

      - name: Set up pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter attune-docs exec playwright install --with-deps chromium

      - name: Validate typed documentation inputs
        run: |
          pnpm exec oxfmt --check .
          pnpm lint
          pnpm exec nx run attune-mcp:typecheck
          pnpm exec nx run attune-mcp:test
          pnpm --filter attune-mcp schema:check
          pnpm --filter attune-docs run audit
          pnpm --filter attune-docs typecheck
          pnpm --filter attune-docs test
          pnpm --filter attune-docs test:e2e
          cd python/attune-activegraph
          uv run --locked ruff check .
          uv run --locked basedpyright
          uv run --locked pytest

      - name: Build documentation
        env:
          DOCS_BASE_PATH: /attune/
          DOCS_SITE_URL: https://becker63.github.io/attune/
          DOCS_SOURCE_COMMIT: ${{ github.sha }}
          DOCS_SOURCE_REF: ${{ github.sha }}
        run: pnpm --filter attune-docs build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: packages/attune-docs/dist

  deploy:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/main-v2'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
